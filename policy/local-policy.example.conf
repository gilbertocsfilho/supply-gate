# Local policy overrides for a single machine.
# Copy this file to policy/local-policy.conf and edit only the values you need.
#
# Example:
# cp policy/local-policy.example.conf policy/local-policy.conf

# Use ai-jail as the local launcher for AI CLIs. Linux and macOS are
# configured separately (AI_JAIL_LAUNCHER_LINUX / AI_JAIL_LAUNCHER_MACOS) even
# though both commonly point at the same ai-jail adapter -- set only the one
# that matches this machine's OS, and note the runtime path differs by scope.
#
# Option 1 (preserves ai-jail's per-tool preset, recommended): point at the
# adapter installed by ./install.sh, which runs `ai-jail <tool> ...`.
#   - machine scope: AI_JAIL_LAUNCHER_LINUX="/opt/supply-gate/runtime/ai-jail-launcher.sh"
#   - user scope:    AI_JAIL_LAUNCHER_LINUX="$HOME/.local/share/supply-chain-protect/runtime/ai-jail-launcher.sh"
#   - macOS uses AI_JAIL_LAUNCHER_MACOS with the same runtime path pattern.
#
# Option 2 (simplest, no preset): point straight at the ai-jail binary. It runs
# the tool by absolute path as a generic sandboxed command.
#   AI_JAIL_LAUNCHER_MACOS="/opt/homebrew/bin/ai-jail"
#
# Then run the AI CLI directly (e.g. `claude`), NOT `ai-jail claude` -- the
# wrapper drives ai-jail for you and guards against double-jailing.
#
# Emergency: to force every AI tool to run unjailed right now, without editing
# this file, export SCP_AI_JAIL_BYPASS=1 (see GUIDE.md "AI Jail" section).

# Example hard-mode overrides:
# NPM_REGISTRY_URL="https://npm-proxy.corp.example/"
# PYTHON_INDEX_URL="https://pypi-proxy.corp.example/simple/"
# CARGO_REGISTRY_URL="sparse+https://cargo-proxy.corp.example/"
# GO_PROXY_URL="https://go-proxy.corp.example/"
