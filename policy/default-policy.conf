POLICY_VERSION="1.0.0"
DEFAULT_MODE="soft"

STATE_DIR_NAME="supply-chain-protect"
LOG_RETENTION_DAYS="30"

NODE_COOLDOWN_MINUTES="10080"
BUN_COOLDOWN_SECONDS="604800"

MANAGED_COMMANDS="npm pnpm yarn bun pip pip3 uv poetry cargo go claude gemini codex agy"
PACKAGE_MANAGERS="npm pnpm yarn bun pip pip3 uv poetry cargo go"
# agy: Antigravity Code CLI (Gemini-based). ai-jail 1.0.0 has no dedicated
# preset for it yet (only gemini, claude, codex, opencode, crush, soulforge,
# bash) -- the launcher adapter still runs it through `ai-jail agy ...`,
# which falls back to generic passthrough: Landlock/seccomp/rlimits still
# apply, just without agy-specific config-dir passthrough tuning.
AI_COMMANDS="claude gemini codex agy"

# Hard-mode values must be customized before rollout.
NPM_REGISTRY_URL="https://registry.example.corp/npm/"
PYTHON_INDEX_URL="https://registry.example.corp/pypi/simple/"
CARGO_REGISTRY_URL="sparse+https://registry.example.corp/crates/"
GO_PROXY_URL="https://registry.example.corp/goproxy/"
GO_SUMDB="sum.golang.org"
GO_PRIVATE_PATTERNS=""
GO_NO_SUMDB_PATTERNS=""
GO_VCS_RULES="public:off,private:git|ssh"

# AI jail backends, configured separately per OS (Linux, macOS, Windows never
# share a launcher/backend: different sandbox tooling, different install
# paths). Each *_LAUNCHER is an executable receiving REAL_BIN then the
# remaining args; empty means "not configured" (see run_ai_tool in
# shims/manager-wrapper.sh for what happens then: hard mode blocks, soft mode
# warns and runs unjailed).
# - linux-custom / macos-custom: executable launcher script (e.g. the ai-jail
#   adapter installed at <runtime>/ai-jail-launcher.sh)
# - windows-wsl: invokes a WSL command wrapper
# - windows-sandbox: placeholder policy gate; operator must provide launcher
AI_JAIL_BACKEND_LINUX="linux-custom"
AI_JAIL_BACKEND_MACOS="macos-custom"
AI_JAIL_BACKEND_WINDOWS="windows-wsl"
AI_JAIL_LAUNCHER_LINUX=""
AI_JAIL_LAUNCHER_MACOS=""
AI_JAIL_LAUNCHER_WINDOWS=""

# Emergency kill switch: set SCP_AI_JAIL_BYPASS=1 in the environment to force
# every AI tool invocation to run unjailed, in both soft and hard mode,
# without editing this file or reapplying. See GUIDE.md "AI Jail" section.

SCFW_AUTO_WRAP="1"
SCFW_MANAGED_TOOLS="npm pip pip3 poetry"

INSTALL_ROOT_OVERRIDE="${INSTALL_ROOT_OVERRIDE:-}"
CONFIG_ROOT_OVERRIDE="${CONFIG_ROOT_OVERRIDE:-}"
